# Planet glyph for the current host. Small, sits in the header segment right
# after the username, before the peach wedge. Hosts are named after planets:
# jupiter, mars, neptune and desktop-l8ab2nr (Saturn). On any other host the
# command exits 1 and starship hides the module, so nothing is added.
#
# Make it yours: each glyph is just the character in its `echo` arm below.
# Defaults are the real astronomical symbols:
#   U+2643  ♃  jupiter
#   U+2642  ♂  mars
#   U+2646  ♆  neptune
#   U+2644  ♄  saturn
# CaskaydiaCove does not include these, so kitty.conf maps them to FreeMono
# (monospace, so the powerline segments stay aligned):
#     symbol_map U+2642,U+2643,U+2644,U+2646 FreeMono
# Any other character (a Nerd Font icon, an emoji) works too.
[custom.planet]
description = "Planet glyph for the current host"
when = true
style = "bg:surface0 fg:text"
format = '[ $output ]($style)'
command = """
case "$(hostname | cut -d. -f1 | tr '[:upper:]' '[:lower:]')" in
  jupiter)         echo '♃' ;;   # U+2643 Jupiter
  mars)            echo '♂' ;;   # U+2642 Mars
  neptune)         echo '♆' ;;   # U+2646 Neptune
  desktop-l8ab2nr) echo '♄' ;;   # U+2644 Saturn
  *)               exit 1 ;;
esac
"""

[username]
show_always = true
style_user = "bg:surface0 fg:text"
style_root = "bg:surface0 fg:text"
format = '[ $user ]($style)'

[directory]
style = "fg:mantle bg:peach"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[git_branch]
symbol = ""
style = "bg:teal"
format = '[[ $symbol $branch ](fg:base bg:green)]($style)'

[git_status]
style = "bg:teal"
format = '[[($all_status$ahead_behind )](fg:base bg:green)]($style)'

[nodejs]
symbol = ""
style = "bg:teal"
format = '[[ $symbol( $version) ](fg:base bg:teal)]($style)'

[c]
symbol = " "
style = "bg:teal"
format = '[[ $symbol( $version) ](fg:base bg:teal)]($style)'

[rust]
symbol = ""
style = "bg:teal"
format = '[[ $symbol( $version) ](fg:base bg:teal)]($style)'

[golang]
symbol = ""
style = "bg:teal"
format = '[[ $symbol( $version) ](fg:base bg:teal)]($style)'

[php]
symbol = ""
style = "bg:teal"
